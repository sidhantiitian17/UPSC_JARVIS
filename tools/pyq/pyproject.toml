[project]
name = "pyq-tools"
version = "0.1.0"
description = "Official UPSC PYQ fetch/extract/parse/validate/review pipeline (Phase 0)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "pillow>=10",
  "pyyaml>=6",
  "jsonschema>=4.21",
]

[project.scripts]
pyq = "pyq.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyq"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
