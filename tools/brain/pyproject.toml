[project]
name = "brain-tools"
version = "0.1.0"
description = "Decision-Brain spike and bake-off tooling (Phase 0)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
laya = ["laya==0.4.20", "psutil>=5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
