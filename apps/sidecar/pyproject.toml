[project]
name = "jarvis-sidecar"
version = "0.1.0"
description = "UPSC JARVIS local sidecar (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6",
  "jsonschema>=4.21",
  "sqlite-vec>=0.1.9",
  "pypdfium2>=5.14.0",
  "fsrs>=6.3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["golden: LLM golden-fixture evaluation (offline by default)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long user-facing prose and SQL fixture strings: wrapping them hurts readability.
"src/jarvis/privacy/service.py" = ["E501"]
"tests/test_privacy.py" = ["E501"]
